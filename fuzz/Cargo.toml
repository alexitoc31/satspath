[package]
name = "satspath-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
satspath-core = { path = "../crates/satspath-core" }
satspath-router = { path = "../crates/satspath-router" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
canonical_json = { version = "0.5", default-features = false }
hex = "0.4"
secp256k1 = { version = "0.29", features = ["rand-std"] }

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "fuzz_bolt12"
path = "fuzz_targets/fuzz_bolt12.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_bip321"
path = "fuzz_targets/fuzz_bip321.rs"
test = false
doc = false
bench = false

[[bin]]
