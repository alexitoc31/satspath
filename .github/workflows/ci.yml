name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "feature/**"]
  pull_request:
    branches: ["main", "develop", "satspath-standalone"]

permissions:
  contents: read

jobs:
  javascript:
    name: Test P2P SDK and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/satspath-p2p/package-lock.json
      - run: npm ci --prefix sdk/satspath-p2p
      - run: npm test --prefix sdk/satspath-p2p
      - run: node --test crates/satspathd/tests/dashboard-auth.test.mjs

  test:
    name: Test workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-features

      - name: Run all tests
        run: cargo test --workspace --all-features

      - name: Clippy — deny warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  bitcoin-regtest:
    name: Bitcoin Core regtest anchor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Start Bitcoin Core regtest
        run: >-
          docker run --detach --name satspath-bitcoind --publish 18443:18443
          bitcoin/bitcoin:27.1
          -regtest -server -txindex=1 -fallbackfee=0.0002
          -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0
          -rpcuser=satspath -rpcpassword=satspath-regtest-only
      - name: Wait for RPC and fund test wallet
        run: |
          READY=0
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --silent --user satspath:satspath-regtest-only --data-binary '{"jsonrpc":"2.0","id":"ci","method":"getblockchaininfo","params":[]}' -H 'content-type:text/plain;' http://127.0.0.1:18443/ 2>/dev/null | grep -q '"chain":"regtest"'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Bitcoin Core regtest node failed to become ready within 30 seconds" >&2
            exit 1
          fi
          set -euo pipefail
          curl --fail --silent --user satspath:satspath-regtest-only --data-binary '{"jsonrpc":"2.0","id":"ci","method":"createwallet","params":["satspath-anchor"]}' -H 'content-type:text/plain;' http://127.0.0.1:18443/
          ADDRESS=$(curl --fail --silent --user satspath:satspath-regtest-only --data-binary '{"jsonrpc":"2.0","id":"ci","method":"getnewaddress","params":[]}' -H 'content-type:text/plain;' http://127.0.0.1:18443/wallet/satspath-anchor | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')
          curl --fail --silent --user satspath:satspath-regtest-only --data-binary "{\"jsonrpc\":\"2.0\",\"id\":\"ci\",\"method\":\"generatetoaddress\",\"params\":[101,\"$ADDRESS\"]}" -H 'content-type:text/plain;' http://127.0.0.1:18443/wallet/satspath-anchor
      - name: Execute OP_RETURN anchor integration test
        env:
          SATSPATH_BITCOIN_NETWORK: regtest
          SATSPATH_BITCOIN_RPC_URL: http://127.0.0.1:18443/wallet/satspath-anchor
          SATSPATH_BITCOIN_RPC_USER: satspath
          SATSPATH_BITCOIN_RPC_PASSWORD: satspath-regtest-only
        run: cargo test -p satspath-core --test regtest_anchor --all-features -- --ignored --test-threads=1
