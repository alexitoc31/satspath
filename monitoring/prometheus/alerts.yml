groups:
  - name: satspathd_alerts
    rules:
      - alert: HighHttpErrorRate
        expr: |
          (sum(rate(satspathd_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(satspathd_http_requests_total[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on satspathd"
          description: "HTTP 5xx error rate is {{ $value | printf \"%.2f\" }}% (> 5%) over the last 5 minutes."

      - alert: FeeApiDown
        expr: |
          sum(rate(satspathd_fee_api_requests_total{status="error"}[3m]))
          /
          sum(rate(satspathd_fee_api_requests_total[3m])) > 0.5
          or
          histogram_quantile(0.95, sum(rate(satspathd_fee_api_latency_seconds_bucket[5m])) by (le)) > 5.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "External Bitcoin fee estimation API failing or high latency"
          description: "Over 50% of fee API requests failed or P95 fee latency exceeded 5 seconds over the last 3 minutes."

      - alert: CheckpointStale
        expr: satspathd_transparency_checkpoint_age_seconds > 86400
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Transparency Log checkpoint is stale"
          description: "The latest transparency log checkpoint age is {{ $value | printf \"%.0f\" }} seconds (> 24 hours). Check anchoring and witness synchronization."

      - alert: HighHttpLatency
        expr: |
          histogram_quantile(0.99, sum(rate(satspathd_http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency on satspathd endpoint"
          description: "Endpoint {{ $labels.endpoint }} P99 latency is {{ $value | printf \"%.2f\" }}s (> 2.0s) over the last 5 minutes."

      - alert: ExcessiveRateLimiting
        expr: sum(rate(satspathd_rate_limit_dropped_total[2m])) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spike in rate-limited or payload-dropped requests"
          description: "satspathd is dropping {{ $value | printf \"%.0f\" }} requests/sec due to rate limiting or payload body bounds."

      - alert: SatspathdInstanceDown
        expr: up{job="satspathd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "satspathd daemon is unreachable"
          description: "Prometheus cannot scrape satspathd metrics endpoint. Process may be crashed or blocked."
