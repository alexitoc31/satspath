global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "satspathd"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["satspathd:9737"]
        labels:
          environment: "production"
          service: "satspathd"
