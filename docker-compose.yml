version: "3.8"

services:
  satspathd:
    build:
      context: .
      target: runtime-daemon
    container_name: satspathd
    restart: unless-stopped
    # Expose internally to the docker network for the Caddy TLS reverse proxy
    expose:
      - "9737"
    # Localhost-only bind on host to allow local debugging while blocking public cleartext access
    ports:
      - "127.0.0.1:9737:9737"
    volumes:
      - satspath_data:/data
    environment:
      - SATSPATH_NETWORK=${SATSPATH_NETWORK:-mainnet}
      - SATSPATHD_BEHIND_PROXY=1
      - SATSPATH_AUTHORITY_DOMAIN=${SATSPATH_AUTHORITY_DOMAIN:-localhost}
      # - SATSPATHD_AUTH_TOKEN=your_secure_token_here (optional, auto-generated if missing)
      # - SATSPATHD_CORS_ORIGIN=https://your-domain.com

  caddy:
    image: caddy:2-alpine
    container_name: satspath-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - satspathd

  satspath-cli:
    build:
      context: .
      target: runtime
    container_name: satspath-cli
    volumes:
      - satspath_data:/data
    environment:
      - SATSPATH_NETWORK=${SATSPATH_NETWORK:-mainnet}

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: satspath-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - satspathd

  grafana:
    image: grafana/grafana:10.4.0
    container_name: satspath-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/satspath:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  satspath_data:
    name: satspath_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
