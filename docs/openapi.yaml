      - read
    AllNotificationsReadResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        all_read:
          type: boolean
      required:
      - status
      - all_read
    TransportStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - disabled
          - starting
          - active
          - degraded
          - stopped
        announcements:
          type: integer
          format: int64
          minimum: 0
        last_publish:
          type: integer
          format: int64
          nullable: true
        last_resolution:
          type: integer
          format: int64
          nullable: true
        active_peers:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - state
      - announcements
      - last_publish
      - last_resolution
      - active_peers
      description: '`active_peers` is null (unknown), not zero, when the peer count is unavailable.'
    ControlResponse:
      type: object
      properties:
        identity:
          type: object
          properties:
            fingerprint:
              type: string
              nullable: true
            active_aliases:
              type: integer
              format: int64
              minimum: 0
            identifier_scope:
              type: string
              enum:
              - local_dev
              - self_asserted
              nullable: true
            identifier_authority:
              type: string
              enum:
              - attested
              - unverified
            verification:
              type: object
              properties:
                profile_signature_verified:
                  type: boolean
                identifier_verified:
                  type: boolean
                key_continuity_verified:
                  type: boolean
                transparency_inclusion_verified:
                  type: boolean
                payment_methods_verified:
                  type: boolean
              nullable: true
            capabilities:
              type: array
              items:
                type: string
              nullable: true
            privacy:
              type: object
              properties:
                plaintext_dht_aliases:
                  type: boolean
                private_keys_transmitted:
                  type: boolean
                spending_keys_transmitted:
                  type: boolean
                peer_addresses_logged:
                  type: boolean
            routing_policy:
              type: string
        hyperswarm:
          $ref: '#/components/schemas/TransportStatus'
        http:
          type: string
          enum:
          - active
        nostr:
          type: string
          enum:
          - on_demand_resolver
        experimental:
          type: boolean
      required:
      - identity
      - hyperswarm
      - http
      - nostr
      - experimental
      description: EXPERIMENTAL node control summary. Exposes no profile contents or descriptors.
    P2pCandidateResponse:
      type: object
      properties:
        source:
          type: string
          enum:
          - hyperswarm
        routing_eligible:
          type: boolean
          enum:
          - false
        profile_signature_verified:
          type: boolean
        identifier_verified:
          type: boolean
          enum:
          - false
        key_continuity_verified:
          type: boolean
          enum:
          - false
        transparency_verified:
          type: boolean
          enum:
          - false
        identifier_scope:
          type: string
          enum:
          - local_dev
          - self_asserted
        payment_method_states:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodVerificationState'
        signed_profile:
          $ref: '#/components/schemas/SignedPaymentProfile'
        warning:
          type: string
      required:
      - source
      - routing_eligible
      - profile_signature_verified
      - identifier_verified
      - key_continuity_verified
      - transparency_verified
      - identifier_scope
      - payment_method_states
      - signed_profile
      - warning
      description: 'A candidate only: never imported, never usable for routing.'
    DashboardAuthResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          enum:
          - true
      required:
      - authenticated
    HealthSimple:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum:
          - healthy
      required:
      - ok
      - status
    DependencyHealth:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        latency_ms:
          type: number
          format: double
        error:
          type: string
      required:
      - status
      - latency_ms
      description: Common fields; additional dependency-specific keys (`writable`, `log_id`, `cached`,
        `checkpoint_count`, ...) are flattened into the object.
      additionalProperties: true
    DeepHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: True for `healthy` and `degraded`.
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        timestamp:
          type: integer
          format: int64
        dependencies:
          type: object
          properties:
            sqlite:
              $ref: '#/components/schemas/DependencyHealth'
            fee_api:
              $ref: '#/components/schemas/DependencyHealth'
            transparency_log:
              $ref: '#/components/schemas/DependencyHealth'
          required:
          - sqlite
          - fee_api
          - transparency_log
      required:
      - ok
      - status
      - version
      - uptime_seconds
      - timestamp
      - dependencies
    V2HealthResponse:
      type: object
      properties:
        version:
          type: string
          enum:
          - 2.0.0
        status:
          type: string
          enum:
          - healthy
          - degraded
        checkpoint_age_secs:
          type: integer
          format: int64
          description: -1 when the log cannot be opened.
        witness_quorum_healthy:
          type: boolean
          description: Currently mirrors log readability.
        replica_count:
          type: integer
          format: int32
      required:
      - version
      - status
      - checkpoint_age_secs
      - witness_quorum_healthy
      - replica_count
