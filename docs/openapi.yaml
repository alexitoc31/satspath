components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 64-hex admin token from `<SATSPATH_HOME>/admin.macaroon` or `SATSPATHD_AUTH_TOKEN`.
        Never log or share it.
  headers:
    XRequestId:
      description: Correlation id (echoed from the request or generated).
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed or invalid request, or an untrusted/missing/duplicate `Host` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: untrusted HTTP Host
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Unauthorized:
      description: Missing or invalid Bearer token (fail-closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Unauthorized: Invalid or missing Bearer token'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    PayloadTooLarge:
      description: Request body exceeds 64 KiB (65,536 bytes) by default.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayloadTooLargeError'
    TooManyRequests:
      description: Per-IP token bucket exhausted.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
    NotFound:
      description: Resource or endpoint not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: endpoint not found
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
      - error
      description: 'Error body used by every non-success response. NOTE: several endpoints return this
        body with HTTP 200 (see `docs/API_REFERENCE.md`, "Errors returned with HTTP 200").'
      example:
        error: endpoint not found
    RateLimitError:
      type: object
      properties:
        error:
          type: string
        retry_after:
          type: integer
          format: int64
          description: Seconds until a token is available.
      required:
      - error
      - retry_after
      example:
        error: 'Too Many Requests: rate limit exceeded'
        retry_after: 2
    PayloadTooLargeError:
      type: object
      properties:
        error:
          type: string
        max_bytes:
          type: integer
          format: int64
          description: Configured body limit.
      required:
      - error
      - max_bytes
      example:
        error: 'Payload Too Large: request body exceeds limit of 65536 bytes'
        max_bytes: 65536
    BitcoinNetwork:
      type: string
      enum:
      - Mainnet
      - Testnet
      - Regtest
      - Signet
    ArkOwnershipProof:
      type: object
      properties:
        message:
          type: string
        signature:
          type: string
        pubkey:
          type: string
      required:
      - message
      - signature
      - pubkey
    PaymentMethod:
      oneOf:
      - $ref: '#/components/schemas/OnchainMethod'
      - $ref: '#/components/schemas/LightningMethod'
      - $ref: '#/components/schemas/ArkMethod'
      - $ref: '#/components/schemas/Bolt12Method'
      discriminator:
        propertyName: type
        mapping:
          Onchain: '#/components/schemas/OnchainMethod'
          Lightning: '#/components/schemas/LightningMethod'
          Ark: '#/components/schemas/ArkMethod'
          Bolt12: '#/components/schemas/Bolt12Method'
      description: A public receive pointer. Discriminated by `type`.
    OnchainMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - Onchain
        label:
          type: string
        network:
          $ref: '#/components/schemas/BitcoinNetwork'
        address:
          type: string
          description: Static address (discouraged by the spec).
        silent_payment_pubkey:
          type: string
          description: BIP-352 scan pubkey (`sp1q...`). EXPERIMENTAL.
        pubkey_hint:
          type: string
          nullable: true
        descriptor_hint:
          type: string
          nullable: true
        address_list:
          type: array
          items:
            type: string
          description: Pre-derived addresses for wallets without BIP-352.
      required:
      - type
      - label
    LightningMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - Lightning
        label:
          type: string
        lightning_address:
          type: string
          nullable: true
        lnurl:
          type: string
          nullable: true
        bolt12:
          type: string
          nullable: true
        receiver_pubkey:
          type: string
          nullable: true
      required:
      - type
      - label
      description: At least one of `lightning_address`, `lnurl` or `bolt12` advertises a receive capability; none is an amount-bound payable QR in the current quote paths.
    ArkMethod:
      type: object
      properties:
        type:
          type: string
          enum:
          - Ark
        label:
          type: string
        server:
          type: string
        pubkey:
          type: string
        vtxo_pointer:
          type: string
          nullable: true
        proof:
          anyOf:
          - $ref: '#/components/schemas/ArkOwnershipProof'
          - type: object
            nullable: true
            enum:
            - null
        expires_at:
          type: integer
          format: int64
          nullable: true
        opaque_uri:
          type: string
          description: Opaque Arkade receive URI; `server`/`pubkey` are empty strings when set.
      required:
      - type
      - label
      - server
      - pubkey
    Bolt12Method:
      type: object
      properties:
        type:
          type: string
          enum:
          - Bolt12
        label:
          type: string
        offer:
          type: string
          description: '`lno1...` offer string.'
        network:
          $ref: '#/components/schemas/BitcoinNetwork'
        minimum_amount_sats:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        issuer_pubkey:
          type: string
      required:
      - type
      - label
      - offer
      - issuer_pubkey
    PayableOnchainMethod:
      oneOf:
      - $ref: '#/components/schemas/MainnetPayableMethod'
      - $ref: '#/components/schemas/TestnetPayableMethod'
      - $ref: '#/components/schemas/SignetPayableMethod'
      - $ref: '#/components/schemas/RegtestPayableMethod'
      discriminator:
        propertyName: network
        mapping:
          Mainnet: '#/components/schemas/MainnetPayableMethod'
          Testnet: '#/components/schemas/TestnetPayableMethod'
          Signet: '#/components/schemas/SignetPayableMethod'
          Regtest: '#/components/schemas/RegtestPayableMethod'
      description: Only an on-chain method with a decoded address on the configured network can yield a payable quote.
    MainnetPayableMethod:
      allOf:
      - $ref: '#/components/schemas/OnchainMethod'
      - type: object
        properties:
          network:
            type: string
            enum: [Mainnet]
          address:
            $ref: '#/components/schemas/MainnetAddress'
        required: [network, address]
        not:
          properties:
            silent_payment_pubkey: {}
          required: [silent_payment_pubkey]
    TestnetPayableMethod:
      allOf:
      - $ref: '#/components/schemas/OnchainMethod'
      - type: object
        properties:
          network:
            type: string
            enum: [Testnet]
          address:
            $ref: '#/components/schemas/TestnetAddress'
        required: [network, address]
        not:
          properties:
            silent_payment_pubkey: {}
          required: [silent_payment_pubkey]
    SignetPayableMethod:
      allOf:
      - $ref: '#/components/schemas/OnchainMethod'
      - type: object
        properties:
          network:
            type: string
            enum: [Signet]
          address:
            $ref: '#/components/schemas/TestnetAddress'
        required: [network, address]
        not:
          properties:
            silent_payment_pubkey: {}
          required: [silent_payment_pubkey]
    RegtestPayableMethod:
      allOf:
      - $ref: '#/components/schemas/OnchainMethod'
      - type: object
        properties:
          network:
            type: string
            enum: [Regtest]
          address:
            $ref: '#/components/schemas/RegtestAddress'
        required: [network, address]
        not:
          properties:
            silent_payment_pubkey: {}
          required: [silent_payment_pubkey]
    MainnetAddress:
      type: string
      minLength: 26
      maxLength: 90
      pattern: '^(?:[13][a-km-zA-HJ-NP-Z1-9]{25,34}|(?:bc1|BC1)[A-Za-z0-9]{8,87})$'
      description: Shape only; the runtime decodes the Bitcoin checksum and validates the network.
    TestnetAddress:
      type: string
      minLength: 14
      maxLength: 90
      pattern: '^(?:tb1|TB1)[A-Za-z0-9]{8,87}$'
      description: Testnet SegWit. Ambiguous testnet/regtest legacy Base58 addresses are rejected at handoff.
    RegtestAddress:
      type: string
      minLength: 16
      maxLength: 90
      pattern: '^(?:bcrt1|BCRT1)[A-Za-z0-9]{8,87}$'
      description: Regtest SegWit. Ambiguous testnet/regtest legacy Base58 addresses are rejected at handoff.
    PayableBip21Payload:
      oneOf:
      - $ref: '#/components/schemas/MainnetPayableUri'
      - $ref: '#/components/schemas/TestnetPayableUri'
      - $ref: '#/components/schemas/RegtestPayableUri'
      description: |
        A canonical `bitcoin:<address>?amount=<BTC>` URI for an on-chain handoff. The network is
        identified by the address prefix. The daemon checks the address checksum and configured
        network, exact satoshi amount (1 to 2,100,000,000,000,000), and rejects duplicate or
        conflicting parameters. OpenAPI 3.0 cannot express equality with the request amount or
        with `selected_method.address`; the runtime enforces both before output.
    MainnetPayableUri:
      type: string
      maxLength: 160
      pattern: '^bitcoin:(?:[13][a-km-zA-HJ-NP-Z1-9]{25,34}|(?:bc1|BC1)[A-Za-z0-9]{8,87})\?amount=(?:0|[1-9][0-9]{0,7})\.[0-9]{8}$'
    TestnetPayableUri:
      type: string
      maxLength: 160
      pattern: '^bitcoin:(?:tb1|TB1)[A-Za-z0-9]{8,87}\?amount=(?:0|[1-9][0-9]{0,7})\.[0-9]{8}$'
    RegtestPayableUri:
      type: string
      maxLength: 160
      pattern: '^bitcoin:(?:bcrt1|BCRT1)[A-Za-z0-9]{8,87}\?amount=(?:0|[1-9][0-9]{0,7})\.[0-9]{8}$'
    ReceivePayload:
      oneOf:
      - $ref: '#/components/schemas/PayableBip21Payload'
      - $ref: '#/components/schemas/OnchainReceivePointer'
      - $ref: '#/components/schemas/LightningReceivePointer'
      - $ref: '#/components/schemas/LnurlReceivePointer'
      description: Amount-less Lightning pointers are receive-only, not payable handoffs. Ark, BOLT12 and Silent Payments fail closed.
    OnchainReceivePointer:
      type: string
      maxLength: 100
      pattern: '^bitcoin:(?:[13][a-km-zA-HJ-NP-Z1-9]{25,34}|(?:bc1|BC1|tb1|TB1|bcrt1|BCRT1)[A-Za-z0-9]{8,87})$'
      description: A decoded on-chain address without an amount; validated against the configured network.
    LightningReceivePointer:
      type: string
      maxLength: 4096
      pattern: '^[A-Za-z0-9._+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z0-9.\-]+$'
      description: Lightning Address, amount-less and receive-only.
    LnurlReceivePointer:
      type: string
      format: uri
      maxLength: 4096
      pattern: '^https://[^/?#@ ]+(?:/[^?#]*)?$'
      description: HTTPS LNURL pointer without credentials, query or fragment; amount-less and receive-only.
    KeyRotation:
      type: object
      properties:
        version:
          type: integer
          format: int32
        identifier_hash:
          type: string
          description: SHA-256 of the canonical identifier.
          pattern: ^[0-9a-f]{64}$
        previous_pubkey:
          type: string
        new_pubkey:
          type: string
        authorization_signature:
          type: string
          description: Schnorr signature by the previous key.
        acceptance_signature:
          type: string
          description: Schnorr signature by the new key.
        previous_event_hash:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        rotated_at:
          type: integer
          format: int64
      required:
      - previous_pubkey
      - new_pubkey
      - authorization_signature
      - rotated_at
    RecoveryPolicy:
      type: object
      properties:
        version:
          type: integer
          format: int32
          default: 1
        threshold:
          type: integer
          format: int32
          description: Minimum guardian signatures (M).
          minimum: 1
        guardians:
          type: array
          items:
            type: string
          description: Distinct compressed secp256k1 pubkeys (N).
      required:
      - threshold
      - guardians
    GuardianSignature:
      type: object
      properties:
        guardian_pubkey:
          type: string
        signature:
          type: string
      required:
      - guardian_pubkey
      - signature
    KeyRecoveryProof:
      type: object
      properties:
        version:
          type: integer
          format: int32
        identifier_hash:
          type: string
        previous_pubkey:
          type: string
        new_pubkey:
          type: string
        previous_event_hash:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        guardian_signatures:
          type: array
          items:
            $ref: '#/components/schemas/GuardianSignature'
        acceptance_signature:
          type: string
        recovered_at:
          type: integer
          format: int64
      required:
      - identifier_hash
      - previous_pubkey
      - new_pubkey
      - previous_event_hash
      - sequence
      - guardian_signatures
      - acceptance_signature
      - recovered_at
    OwnershipProof:
      oneOf:
      - $ref: '#/components/schemas/MessageSignatureProof'
      - $ref: '#/components/schemas/WellKnownChallengeProof'
      discriminator:
        propertyName: proof
        mapping:
          MessageSignature: '#/components/schemas/MessageSignatureProof'
          WellKnownChallenge: '#/components/schemas/WellKnownChallengeProof'
    MessageSignatureProof:
      type: object
      properties:
        proof:
          type: string
          enum:
          - MessageSignature
        message:
          type: string
        signature:
          type: string
        pubkey:
          type: string
          nullable: true
      required:
      - proof
      - message
      - signature
    WellKnownChallengeProof:
      type: object
      properties:
        proof:
          type: string
          enum:
          - WellKnownChallenge
        url:
          type: string
        nonce:
          type: string
        expected_body_hash:
          type: string
      required:
      - proof
      - url
      - nonce
      - expected_body_hash
    ProofType:
      type: string
      enum:
      - DomainWellKnown
      - LightningAddressChallenge
      - OnchainAddressSignature
      - ArkPubkeySignature
      - ManualAttestation
      - Bip353Dnssec
    VerificationStatus:
      oneOf:
      - $ref: '#/components/schemas/VerificationStatusUnverified'
      - $ref: '#/components/schemas/VerificationStatusVerified'
      discriminator:
        propertyName: status
        mapping:
          Unverified: '#/components/schemas/VerificationStatusUnverified'
          Verified: '#/components/schemas/VerificationStatusVerified'
    VerificationStatusUnverified:
      type: object
      properties:
        status:
          type: string
          enum:
          - Unverified
      required:
      - status
    VerificationStatusVerified:
      type: object
      properties:
        status:
          type: string
          enum:
          - Verified
        proof_type:
          $ref: '#/components/schemas/ProofType'
        verified_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
        proof:
          $ref: '#/components/schemas/OwnershipProof'
      required:
      - status
      - proof_type
      - verified_at
      - proof
    MethodVerification:
      type: object
      properties:
        method_descriptor:
          type: string
          description: Equals the method's ownership descriptor, e.g. `ln-address:alice@example.com`.
        status:
          $ref: '#/components/schemas/VerificationStatus'
      required:
      - method_descriptor
      - status
    PqcSuite:
      type: string
      enum:
      - mlkem768_x25519
      - mldsa65_schnorr
    HybridPublicKey:
      type: object
      properties:
        classical_pubkey:
          type: string
        pqc_verification_key:
          type: string
        suite:
          $ref: '#/components/schemas/PqcSuite'
      required:
      - classical_pubkey
      - pqc_verification_key
      - suite
      description: 'RESEARCH: post-quantum hybrid public key bundle.'
    HybridSignature:
      type: object
      properties:
        schnorr_sig:
          type: string
        pqc_sig:
          type: string
        suite:
          $ref: '#/components/schemas/PqcSuite'
      required:
      - schnorr_sig
      - pqc_sig
      - suite
      description: 'RESEARCH: Schnorr + ML-DSA-65 hybrid signature.'
    PaymentProfile:
      type: object
      properties:
        alias:
          type: string
          description: Human-readable identifier, e.g. `alice@example.com`.
        identity_pubkey:
          type: string
          description: Compressed secp256k1 identity public key (33 bytes).
          pattern: ^[0-9a-f]{66}$
        methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
          description: Ordered, most preferred first.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp of last update.
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp after which the profile must not be routed.
        sequence:
          type: integer
          format: int64
          description: Strictly increasing replay-protection counter.
          minimum: 0
        preferences:
          type: array
          items:
            type: string
          description: Rail preference order, e.g. `[lightning, ark, onchain]`.
        nonce:
          type: string
        rotation:
          $ref: '#/components/schemas/KeyRotation'
        method_verifications:
          type: array
          items:
            $ref: '#/components/schemas/MethodVerification'
        hybrid_pubkey:
          $ref: '#/components/schemas/HybridPublicKey'
        pqc_required:
          type: boolean
          default: false
        revoked:
          type: boolean
          description: Owner revoked this profile/key.
          default: false
        recovery_policy:
          $ref: '#/components/schemas/RecoveryPolicy'
        recovery:
          $ref: '#/components/schemas/KeyRecoveryProof'
      required:
      - alias
      - identity_pubkey
      - methods
      - updated_at
      description: Public payment profile. Contains no private material.
    SignedPaymentProfile:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/PaymentProfile'
        signature:
          type: string
          description: BIP-340 Schnorr signature over `SHA256("SatsPathProfileV1" || canonical_json(profile))`.
          pattern: ^[0-9a-f]{128}$
        hybrid_signature:
          $ref: '#/components/schemas/HybridSignature'
      required:
      - profile
      - signature
    MerkleInclusionProof:
      type: object
      properties:
        leaf_index:
          type: integer
          format: int64
          minimum: 0
        tree_size:
          type: integer
          format: int64
          minimum: 0
        leaf_hash:
          type: string
        audit_path:
          type: array
          items:
            type: string
        root_hash:
          type: string
      required:
      - leaf_index
      - tree_size
      - leaf_hash
      - audit_path
      - root_hash
    MerkleConsistencyProof:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: 1 = full leaf list (<=16384 leaves), 2 = compact RFC 6962.
        old_tree_size:
          type: integer
          format: int64
          minimum: 0
        new_tree_size:
          type: integer
          format: int64
          minimum: 0
        old_root:
          type: string
        new_root:
          type: string
        audit_path:
          type: array
          items:
            type: string
      required:
      - version
      - old_tree_size
      - new_tree_size
      - old_root
      - new_root
      - audit_path
    BitcoinAnchor:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/BitcoinNetwork'
        txid:
          type: string
        block_hash:
          type: string
          nullable: true
        block_height:
          type: integer
          format: int64
          nullable: true
        confirmations:
          type: integer
          format: int32
        commitment:
          type: string
        verified:
          type: boolean
        prev_txid:
          type: string
        prev_vout:
          type: integer
          format: int32
        continuation_vout:
          type: integer
          format: int32
        chain_index:
          type: integer
          format: int64
      required:
      - network
      - txid
      - confirmations
      - commitment
      - verified
      description: OP_RETURN checkpoint anchor (Catena chain). Regtest only in the current build.
    OperatorKeyRotation:
      type: object
      properties:
        version:
          type: integer
          format: int32
        log_id:
          type: string
        previous_operator_pubkey:
          type: string
        new_operator_pubkey:
          type: string
        previous_checkpoint_hash:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 1
        rotated_at:
          type: integer
          format: int64
        old_key_authorization:
          type: string
        new_key_acceptance:
          type: string
      required:
      - version
      - log_id
      - previous_operator_pubkey
      - new_operator_pubkey
      - previous_checkpoint_hash
      - sequence
      - rotated_at
      - old_key_authorization
      - new_key_acceptance
    TransparencyCheckpoint:
      type: object
      properties:
        version:
          type: integer
          format: int32
        log_id:
          type: string
        log_size:
          type: integer
          format: int64
          minimum: 0
        log_root:
          type: string
        map_root:
          type: string
          nullable: true
        previous_checkpoint_hash:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        operator_pubkey:
          type: string
        operator_sequence:
          type: integer
          format: int64
          minimum: 0
        operator_rotation:
          anyOf:
          - $ref: '#/components/schemas/OperatorKeyRotation'
          - type: object
            nullable: true
            enum:
            - null
        operator_signature:
          type: string
        bitcoin_anchor:
          anyOf:
          - $ref: '#/components/schemas/BitcoinAnchor'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - version
      - log_id
      - log_size
      - log_root
      - created_at
      - operator_pubkey
      - operator_sequence
      - operator_signature
      description: Operator-signed commitment to the append-only log.
    NameAction:
      type: string
      enum:
      - register
      - update_profile
      - rotate_key
      - revoke
      - recover_key
    NameEvent:
      type: object
      properties:
        version:
          type: integer
          format: int32
        identifier_hash:
          type: string
        action:
          $ref: '#/components/schemas/NameAction'
        identity_pubkey:
          type: string
        profile_hash:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        previous_event_hash:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        identifier_attestation_hash:
          type: string
          nullable: true
        removed_method_hashes:
          type: array
          items:
            type: string
        rotation:
          anyOf:
          - $ref: '#/components/schemas/KeyRotation'
          - type: object
            nullable: true
            enum:
            - null
        recovery_policy:
          $ref: '#/components/schemas/RecoveryPolicy'
        recovery:
          $ref: '#/components/schemas/KeyRecoveryProof'
        owner_signature:
          type: string
      required:
      - version
      - identifier_hash
      - action
      - identity_pubkey
      - profile_hash
      - sequence
      - created_at
      - owner_signature
    StateMapValue:
      type: object
      properties:
        latest_event_hash:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
          - Registered
          - Revoked
      required:
      - latest_event_hash
      - sequence
      - status
    StateMapProof:
      type: object
      properties:
        key_hash:
          type: string
        value:
          anyOf:
          - $ref: '#/components/schemas/StateMapValue'
          - type: object
            nullable: true
            enum:
            - null
        audit_path:
          type: array
          items:
            type: string
      required:
      - key_hash
      - audit_path
      description: 'Sparse-Merkle proof; `value: null` proves non-inclusion.'
    NamespaceDescriptor:
      type: object
      properties:
        version:
          type: integer
          format: int32
        domain:
          type: string
        log_id:
          type: string
        authority_pubkey:
          type: string
        endpoint_urls:
          type: array
          items:
            type: string
        witness_quorum:
          type: integer
          format: int32
          minimum: 0
        witness_pubkeys:
          type: array
          items:
            type: string
        valid_from:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        signature:
          type: string
          description: Currently an empty string (the daemon does not sign the descriptor).
      required:
      - version
      - domain
      - log_id
      - authority_pubkey
      - endpoint_urls
      - witness_quorum
      - witness_pubkeys
      - valid_from
      - expires_at
      - signature
    WitnessCosignature:
      type: object
      properties:
        version:
          type: integer
          format: int32
        witness_id:
          type: string
        witness_pubkey:
          type: string
        checkpoint_hash:
          type: string
        tree_size:
          type: integer
          format: int64
          minimum: 0
        timestamp:
          type: integer
          format: int64
        signature:
          type: string
      required:
      - version
      - witness_id
      - witness_pubkey
      - checkpoint_hash
      - tree_size
      - timestamp
      - signature
    ResolutionRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Identifier to resolve, e.g. `alice@example.com`.
        pinned_tree_size:
          type: integer
          format: int64
          description: Accepted by the schema; currently ignored by the daemon.
          minimum: 0
        include_history:
          type: boolean
          description: Accepted by the schema; currently ignored by the daemon.
          default: false
      required:
      - identifier
    ResolutionEnvelope:
      type: object
      properties:
        version:
          type: integer
          format: int32
          enum:
          - 2
        identifier:
          type: string
        namespace_descriptor:
          $ref: '#/components/schemas/NamespaceDescriptor'
        signed_profile:
          $ref: '#/components/schemas/SignedPaymentProfile'
        name_events:
          type: array
          items:
            $ref: '#/components/schemas/NameEvent'
        inclusion_proof:
          $ref: '#/components/schemas/MerkleInclusionProof'
        checkpoint:
          $ref: '#/components/schemas/TransparencyCheckpoint'
        consistency_proof:
          anyOf:
          - $ref: '#/components/schemas/MerkleConsistencyProof'
          - type: object
            nullable: true
            enum:
            - null
        current_state_proof:
          anyOf:
          - $ref: '#/components/schemas/StateMapProof'
          - type: object
            nullable: true
            enum:
            - null
        witness_cosignatures:
          type: array
          items:
            $ref: '#/components/schemas/WitnessCosignature'
        served_at:
          type: integer
          format: int64
      required:
      - version
      - identifier
      - namespace_descriptor
      - signed_profile
      - name_events
      - inclusion_proof
      - checkpoint
      - witness_cosignatures
      - served_at
      description: Proof-carrying S2S v2 resolution result. `consistency_proof` is currently always null
        and `witness_cosignatures` always empty on this daemon.
    TransparencyStatus:
      type: object
      properties:
        log_size:
          type: integer
          format: int64
          minimum: 0
        log_root:
          type: string
        latest_checkpoint_hash:
          type: string
          nullable: true
        registered_identifiers:
          type: integer
          format: int64
          minimum: 0
        key_rotations:
          type: integer
          format: int64
          minimum: 0
        key_recoveries:
          type: integer
          format: int64
          minimum: 0
        revocations:
          type: integer
          format: int64
          minimum: 0
        map_root:
          type: string
          nullable: true
        consistency_status:
          type: string
          enum:
          - empty
          - valid
          - invalid
          - unanchored
      required:
      - log_size
      - log_root
      - registered_identifiers
      - key_rotations
      - revocations
      - consistency_status
    CheckpointPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransparencyCheckpoint'
        offset:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - offset
      - limit
      - total
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NameEvent'
        offset:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - offset
      - limit
      - total
    AnchorPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BitcoinAnchor'
        offset:
          type: integer
          format: int64
          minimum: 0
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - offset
      - limit
      - total
    IdentifierHistory:
      type: object
      properties:
        identifier_hash:
          type: string
        latest:
          anyOf:
          - $ref: '#/components/schemas/NameEvent'
          - type: object
            nullable: true
            enum:
            - null
        history:
          type: array
          items:
            $ref: '#/components/schemas/NameEvent'
      required:
      - identifier_hash
      - latest
      - history
    CatenaChain:
      type: object
      properties:
        chain_length:
          type: integer
          format: int64
          minimum: 0
        genesis:
          anyOf:
          - $ref: '#/components/schemas/BitcoinAnchor'
          - type: object
            nullable: true
            enum:
            - null
        latest:
          anyOf:
          - $ref: '#/components/schemas/BitcoinAnchor'
          - type: object
            nullable: true
            enum:
            - null
        anchors:
          $ref: '#/components/schemas/AnchorPage'
      required:
      - chain_length
      - genesis
      - latest
      - anchors
    InclusionVerifyRequest:
      type: object
      properties:
        event_hash:
          type: string
        proof:
          $ref: '#/components/schemas/MerkleInclusionProof'
        checkpoint:
          $ref: '#/components/schemas/TransparencyCheckpoint'
      required:
      - event_hash
      - proof
      - checkpoint
    ConsistencyVerifyRequest:
      type: object
      properties:
        proof:
          $ref: '#/components/schemas/MerkleConsistencyProof'
      required:
      - proof
    CatenaVerifyRequest:
      type: object
      properties:
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/BitcoinAnchor'
        checkpoint_hashes:
          type: array
          items:
            type: string
          description: Optional commitments to check against the anchors.
      required:
      - anchors
    ValidResult:
      type: object
      properties:
        valid:
          type: boolean
      required:
      - valid
    CatenaVerifyResult:
      type: object
      properties:
        structurally_consistent:
          type: boolean
        commitments_valid:
          type: boolean
          description: Present only when `checkpoint_hashes` was supplied.
      required:
      - structurally_consistent
    TrustTier:
      type: string
      enum:
      - Cryptographic
      - DomainControl
      - SelfAsserted
    PaymentMethodVerificationState:
      type: object
      properties:
        descriptor:
          type: string
        verified:
          type: boolean
        trust_tier:
          anyOf:
          - $ref: '#/components/schemas/TrustTier'
          - type: object
            nullable: true
            enum:
            - null
        reason:
          type: string
      required:
      - descriptor
      - verified
      - trust_tier
      - reason
    VerificationStates:
      type: object
      properties:
        profile_signature_verified:
          type: boolean
        identifier_verified:
          type: boolean
          description: True only with a trusted-verifier attestation; plain email syntax is `false`.
        key_continuity_verified:
          type: boolean
        transparency_inclusion_verified:
          type: boolean
        checkpoint_binding_verified:
          type: boolean
        checkpoint_consistency_verified:
          type: boolean
        operator_continuity_verified:
          type: boolean
        payment_methods_verified:
          type: boolean
        payment_method_states:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodVerificationState'
      required:
      - profile_signature_verified
      - identifier_verified
      - key_continuity_verified
      - transparency_inclusion_verified
      - checkpoint_binding_verified
      - checkpoint_consistency_verified
      - operator_continuity_verified
      - payment_methods_verified
      - payment_method_states
    IdentifierAttestation:
      type: object
      properties:
        version:
          type: integer
          format: int32
        identifier_hash:
          type: string
        identity_pubkey:
          type: string
        profile_hash:
          type: string
        nonce:
          type: string
        issued_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        method:
          type: string
          enum:
          - email
          - dns
          - nip05
          - platform
          - domain
        verifier_pubkey:
          type: string
        verifier_signature:
          type: string
      required:
      - version
      - identifier_hash
      - identity_pubkey
      - profile_hash
      - nonce
      - issued_at
      - expires_at
      - method
      - verifier_pubkey
      - verifier_signature
    ResolvedTransparentProfile:
      type: object
      properties:
        signed_profile:
          $ref: '#/components/schemas/SignedPaymentProfile'
        latest_event:
          $ref: '#/components/schemas/NameEvent'
        inclusion_proof:
          $ref: '#/components/schemas/MerkleInclusionProof'
        checkpoint:
          $ref: '#/components/schemas/TransparencyCheckpoint'
        consistency_proof:
          anyOf:
          - $ref: '#/components/schemas/MerkleConsistencyProof'
          - type: object
            nullable: true
            enum:
            - null
        identifier_attestation:
          anyOf:
          - $ref: '#/components/schemas/IdentifierAttestation'
          - type: object
            nullable: true
            enum:
            - null
        resolver_source:
          type: string
          enum:
          - local_registry
          - http
          - bip353
          - nostr
          - p2p
        verification:
          $ref: '#/components/schemas/VerificationStates'
      required:
      - signed_profile
      - latest_event
      - inclusion_proof
      - checkpoint
      - consistency_proof
      - identifier_attestation
      - resolver_source
      - verification
      description: Result of the mandatory transparency composition (signature, history, continuity, inclusion,
        consistency, operator continuity, method ownership). Failure is terminal.
    AliasRequest:
      type: object
      properties:
        alias:
          type: string
      required:
      - alias
      example:
        alias: alice@example.com
    QuoteRequest:
      type: object
      properties:
        recipient:
          type: string
          description: Recipient identifier.
        amount_sats:
          type: integer
          format: int64
          minimum: 1
          maximum: 2100000000000000
      required:
      - recipient
      - amount_sats
      example:
        recipient: alice@example.com
        amount_sats: 50000
    PayRequest:
      type: object
      properties:
        recipient:
          type: string
        amount_sats:
          type: integer
          format: int64
          minimum: 1
          maximum: 2100000000000000
        memo:
          type: string
          description: Screened for private material.
      required:
      - recipient
      - amount_sats
      example:
        recipient: alice@example.com
        amount_sats: 21000
        memo: coffee
    QuoteRecipient:
      type: object
      properties:
        alias:
          type: string
        verified:
          type: boolean
          description: Legacy flag; prefer the two explicit fields.
        profile_signature_verified:
          type: boolean
        identifier_verified:
          type: boolean
        identifier_verification:
          type: string
        fingerprint:
          type: string
          nullable: true
      required:
      - alias
      - verified
      - profile_signature_verified
      - identifier_verified
      - identifier_verification
    Invite:
      type: object
      properties:
        alias_hash:
          type: string
        amount_sats:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        claim_url:
          type: string
        warning:
          type: string
        sender_signature:
          type: string
        sender_pubkey:
          type: string
        invite_id:
          type: string
      required:
      - alias_hash
      - amount_sats
      - created_at
      - expires_at
      - claim_url
      - warning
    ExecutionMode:
      type: string
      enum:
      - preview
      - mainnet_preview
      - testnet_experimental
      - manual_wallet
    QuoteResponse:
      oneOf:
      - $ref: '#/components/schemas/QuoteOk'
      - $ref: '#/components/schemas/QuoteNotRegistered'
      - $ref: '#/components/schemas/QuoteNoRoute'
      - $ref: '#/components/schemas/QuoteInvalidSignature'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/QuoteOk'
          not_registered: '#/components/schemas/QuoteNotRegistered'
          no_route: '#/components/schemas/QuoteNoRoute'
          invalid_signature: '#/components/schemas/QuoteInvalidSignature'
      description: Protocol quote contract. Always returned with HTTP 200; branch on `status`.
    QuoteOk:
      type: object
      description: The router filters methods through `build_qr_payload` before selection; amount-less Lightning pointers are not payable quotes. The daemon validates the final payload again.
      properties:
        status:
          type: string
          enum:
          - ok
        recipient:
          $ref: '#/components/schemas/QuoteRecipient'
        selected_method:
          $ref: '#/components/schemas/PayableOnchainMethod'
        fee_sats:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        eta:
          type: string
          nullable: true
        reason:
          type: string
        qr:
          $ref: '#/components/schemas/PayableBip21Payload'
        execution:
          $ref: '#/components/schemas/ExecutionMode'
        wallet_hint:
          type: string
      required:
      - status
      - recipient
      - selected_method
      - reason
      - qr
    QuoteNotRegistered:
      type: object
      properties:
        status:
          type: string
          enum:
          - not_registered
        invite:
          $ref: '#/components/schemas/Invite'
      required:
      - status
      - invite
    QuoteNoRoute:
      type: object
      properties:
        status:
          type: string
          enum:
          - no_route
        reason:
          type: string
      required:
      - status
      - reason
    QuoteInvalidSignature:
      type: object
      properties:
        status:
          type: string
          enum:
          - invalid_signature
        recipient:
          $ref: '#/components/schemas/QuoteRecipient'
      required:
      - status
      - recipient
    SafetyStatus:
      type: object
      properties:
        moves_funds:
          type: boolean
          enum:
          - false
        signs_bitcoin_transactions:
          type: boolean
          enum:
          - false
        broadcasts_transactions:
          type: boolean
          enum:
          - false
        stores_wallet_seeds_or_spending_keys:
          type: boolean
          enum:
          - false
        manages_signed_profiles:
          type: boolean
      required:
      - moves_funds
      - signs_bitcoin_transactions
      - broadcasts_transactions
      - stores_wallet_seeds_or_spending_keys
      - manages_signed_profiles
      description: Constant non-custody attestation included in handoff responses.
    PreviewResponse:
      type: object
      properties:
        mode:
          type: string
          enum:
          - preview_only
        warnings:
          type: array
          items:
            type: string
        quote:
          $ref: '#/components/schemas/QuoteResponse'
      required:
      - mode
      - warnings
      - quote
    WalletHandoff:
      type: object
      properties:
        mode:
          type: string
          enum:
          - external_wallet
        instruction:
          type: string
        opens_external_wallet:
          type: boolean
        daemon_executes_payment:
          type: boolean
          enum:
          - false
      required:
      - mode
      - instruction
      - opens_external_wallet
      - daemon_executes_payment
    PayResponse:
      oneOf:
      - $ref: '#/components/schemas/PayWalletHandoff'
      - $ref: '#/components/schemas/PayInviteCreated'
      - $ref: '#/components/schemas/PayNoRoute'
      - $ref: '#/components/schemas/PayInvalidSignature'
      discriminator:
        propertyName: status
        mapping:
          wallet_handoff: '#/components/schemas/PayWalletHandoff'
          invite_created: '#/components/schemas/PayInviteCreated'
          no_route: '#/components/schemas/PayNoRoute'
          invalid_signature: '#/components/schemas/PayInvalidSignature'
      description: Wallet handoff decision. Never moves funds. Always HTTP 200; branch on `status`.
    PayWalletHandoff:
      type: object
      description: Only a validated `QuoteOk` can become a wallet handoff; `/v1/pay` copies its amount-bound BIP-21 QR into `payment_payload`.
      properties:
        status:
          type: string
          enum:
          - wallet_handoff
        decision_protocol:
          type: string
          enum:
          - satspathd.v1
        safety:
          $ref: '#/components/schemas/SafetyStatus'
        quote:
          $ref: '#/components/schemas/QuoteOk'
        recipient:
          type: string
        amount_sats:
          type: integer
          format: int64
          minimum: 1
          maximum: 2100000000000000
        payment_payload:
          $ref: '#/components/schemas/PayableBip21Payload'
        qr_svg:
          type: string
          description: Self-contained SVG QR.
        handoff:
          $ref: '#/components/schemas/WalletHandoff'
      required:
      - status
      - decision_protocol
      - recipient
      - amount_sats
      - quote
      - payment_payload
      - qr_svg
      - handoff
      - safety
    PayInviteCreated:
      type: object
      properties:
        status:
          type: string
          enum:
          - invite_created
        decision_protocol:
          type: string
          enum:
          - satspathd.v1
        safety:
          $ref: '#/components/schemas/SafetyStatus'
        quote:
          $ref: '#/components/schemas/QuoteResponse'
        recipient_hint:
          type: string
          description: Masked identifier.
        amount_sats:
          type: integer
          format: int64
      required:
      - status
      - decision_protocol
      - recipient_hint
      - amount_sats
      - quote
      - safety
    PayNoRoute:
      type: object
      properties:
        status:
          type: string
          enum:
          - no_route
        decision_protocol:
          type: string
          enum:
          - satspathd.v1
        safety:
          $ref: '#/components/schemas/SafetyStatus'
        quote:
          $ref: '#/components/schemas/QuoteResponse'
        reason:
          type: string
      required:
      - status
      - decision_protocol
      - reason
      - quote
      - safety
    PayInvalidSignature:
      type: object
      properties:
        status:
          type: string
          enum:
          - invalid_signature
        decision_protocol:
          type: string
          enum:
          - satspathd.v1
        safety:
          $ref: '#/components/schemas/SafetyStatus'
        quote:
          $ref: '#/components/schemas/QuoteResponse'
      required:
      - status
      - decision_protocol
      - quote
      - safety
    DnsResolveRequest:
      type: object
      properties:
        name:
          type: string
          description: BIP-353 name, e.g. `₿alice@example.com`.
        allow_insecure_dns_for_dev:
          type: boolean
          description: Switch DNSSEC policy from Strict to DevInsecure. Development only.
          default: false
      required:
      - name
      example:
        name: alice@example.com
    Bip353Name:
      type: object
      properties:
        user:
          type: string
        domain:
          type: string
        display:
          type: string
        dns_name:
          type: string
      required:
      - user
      - domain
      - display
      - dns_name
    Bip353Resolution:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Bip353Name'
        bitcoin_uri:
          type: string
          description: Raw DNS-record instruction; DNSSEC authenticity alone does not make it a validated wallet handoff.
        dnssec_validated:
          type: boolean
        ttl_seconds:
          type: integer
          format: int32
          nullable: true
        resolved_at:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            type: string
      required:
      - name
      - bitcoin_uri
      - dnssec_validated
      - resolved_at
      - warnings
    Bip321Instruction:
      oneOf:
      - $ref: '#/components/schemas/Bip321Onchain'
      - $ref: '#/components/schemas/Bip321Bolt11'
      - $ref: '#/components/schemas/Bip321Bolt12'
      - $ref: '#/components/schemas/Bip321SilentPayment'
      - $ref: '#/components/schemas/Bip321Unknown'
      discriminator:
        propertyName: kind
        mapping:
          onchain: '#/components/schemas/Bip321Onchain'
          lightning_bolt11: '#/components/schemas/Bip321Bolt11'
          bolt12_offer: '#/components/schemas/Bip321Bolt12'
          silent_payment: '#/components/schemas/Bip321SilentPayment'
          unknown: '#/components/schemas/Bip321Unknown'
      description: |
        Inert parser output, NOT a validated wallet handoff. The parser intentionally preserves
        untrusted BIP-321 instructions, even malformed or unsupported rails; do not render these
        fields as a payment QR. Payable outputs use `PayableBip21Payload` after strict validation.
    Bip321Onchain:
      type: object
      properties:
        kind:
          type: string
          enum:
          - onchain
        address:
          type: string
          description: Raw URI address; this inert parser does not decode its checksum or network.
        amount_btc:
          type: string
          nullable: true
          description: Raw amount text, potentially malformed or duplicated in the input; not a validated satoshi amount.
      required:
      - kind
      - address
    Bip321Bolt11:
      type: object
      properties:
        kind:
          type: string
          enum:
          - lightning_bolt11
        invoice:
          type: string
          description: Raw invoice parameter, not verified for signature, network, amount, payee or expiry here.
      required:
      - kind
      - invoice
    Bip321Bolt12:
      type: object
      properties:
        kind:
          type: string
          enum:
          - bolt12_offer
        offer:
          type: string
          description: Raw experimental offer parameter; never a payable handoff from this parser.
      required:
      - kind
      - offer
    Bip321SilentPayment:
      type: object
      properties:
        kind:
          type: string
          enum:
          - silent_payment
        address:
          type: string
          description: Raw experimental Silent Payment parameter; never a payable handoff from this parser.
      required:
      - kind
      - address
    Bip321Unknown:
      type: object
      properties:
        kind:
          type: string
          enum:
          - unknown
        key:
          type: string
        value:
          type: string
        required:
          type: boolean
      required:
      - kind
      - key
      - value
      - required
    ParsedBip321Uri:
      type: object
      description: Inert, untrusted BIP-321 parse result; not a validated wallet-handoff payload.
      properties:
        raw:
          type: string
        address:
          type: string
          nullable: true
        amount_btc:
          type: string
          nullable: true
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/Bip321Instruction'
        sp_profile:
          type: string
        sp_profile_hash:
          type: string
      required:
      - raw
      - address
      - amount_btc
      - instructions
    DnsResolveResponse:
      oneOf:
      - $ref: '#/components/schemas/DnsResolveOk'
      - $ref: '#/components/schemas/DnsResolveError'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/DnsResolveOk'
          error: '#/components/schemas/DnsResolveError'
      description: 'Always HTTP 200; DNS failures are reported as `status: error`.'
    DnsResolveOk:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        resolution:
          $ref: '#/components/schemas/Bip353Resolution'
        parsed:
          $ref: '#/components/schemas/ParsedBip321Uri'
      required:
      - status
      - resolution
      - parsed
    DnsResolveError:
      type: object
      properties:
        status:
          type: string
          enum:
          - error
        name:
          type: string
        error:
          type: string
        strict_mode:
          type: boolean
      required:
      - status
      - name
      - error
      - strict_mode
    ReceiveRequest:
      type: object
      properties:
        rail:
          type: string
          description: '`lightning`, `onchain` or `ark` (case-insensitive). Without a rail, Lightning
            is preferred for amount-less requests, on-chain for amount-bound requests. An unsupported
            selected rail returns an error.'
        amount_sats:
          type: integer
          format: int64
          minimum: 1
          maximum: 2100000000000000
      example:
        rail: onchain
        amount_sats: 25000
    ReceiveView:
      type: object
      properties:
        alias:
          type: string
          description: Masked, e.g. `a***@example.com`.
        rail:
          type: string
          enum:
          - Lightning
          - Onchain
        payload:
          $ref: '#/components/schemas/ReceivePayload'
        qr_svg:
          type: string
      required:
      - alias
      - rail
      - payload
      - qr_svg
    SendRequest:
      type: object
      properties:
        recipient:
          type: string
        amount_sats:
          type: integer
          format: int64
          minimum: 1
          maximum: 2100000000000000
        routing_ok:
          type: boolean
          description: Model Lightning routing health (default true).
      required:
      - recipient
      - amount_sats
      example:
        recipient: alice@example.com
        amount_sats: 21000
    EmailInvite:
      type: object
      properties:
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        mailto:
          type: string
      required:
      - to
      - subject
      - body
      - mailto
    SendResponse:
      oneOf:
      - $ref: '#/components/schemas/SendOk'
      - $ref: '#/components/schemas/SendInvite'
      - $ref: '#/components/schemas/SendInvalidSignature'
      - $ref: '#/components/schemas/SendNoRoute'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/SendOk'
          invite: '#/components/schemas/SendInvite'
          invalid_signature: '#/components/schemas/SendInvalidSignature'
          no_route: '#/components/schemas/SendNoRoute'
      description: Preview-only routing result. Always HTTP 200; branch on `status`.
    SendOk:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        mode:
          type: string
