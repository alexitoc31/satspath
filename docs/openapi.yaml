      summary: Rate-limiter statistics
      description: Operational state of the per-IP token-bucket limiter.
      operationId: getRateLimitDiagnostics
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimiterStats'
              example:
                tracked_ips: 1
                total_allowed: 42
                total_blocked: 0
                total_payload_too_large: 0
                burst_capacity: 60
                refill_rate_per_sec: 10.0
                trust_proxy_headers: false
                max_body_bytes: 65536
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/status:
    get:
      tags:
      - Node
      summary: Daemon status
      description: Version, network, bind address, wallet/alias state, safety flags and rate-limiter stats.
        Exposes the daemon home path; deploy behind a trusted network or proxy.
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Success. **On failure the daemon also answers HTTP 200** with an `Error` body.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StatusResponse'
                - $ref: '#/components/schemas/Error'
              example:
                daemon: satspathd
                version: 0.1.0
                bind: 127.0.0.1:9737
                network: devnet
                home: /home/user/.satspath
                wallet_initialized: true
                alias: alice@example.com
                identity_fingerprint: a8fdac91
                methods:
                - Lightning
                - Onchain
                safety:
                  moves_funds: false
                  signs_bitcoin_transactions: false
                  broadcasts_transactions: false
                  stores_wallet_seeds_or_spending_keys: false
                  manages_signed_profiles: true
                rate_limit:
                  tracked_ips: 1
                  total_allowed: 42
                  total_blocked: 0
                  total_payload_too_large: 0
                  burst_capacity: 60
                  refill_rate_per_sec: 10.0
                  trust_proxy_headers: false
                  max_body_bytes: 65536
                is_tls: false
                behind_proxy: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
