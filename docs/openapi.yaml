          format: int64
          minimum: 0
        total_allowed:
          type: integer
          format: int64
          minimum: 0
        total_blocked:
          type: integer
          format: int64
          minimum: 0
        total_payload_too_large:
          type: integer
          format: int64
          minimum: 0
        burst_capacity:
          type: integer
          format: int32
        refill_rate_per_sec:
          type: number
          format: double
        trust_proxy_headers:
          type: boolean
        max_body_bytes:
          type: integer
          format: int64
