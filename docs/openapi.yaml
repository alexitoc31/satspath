# satspathd OpenAPI 3.0.3 specification.
# Maintained by hand from crates/satspathd/src/router.rs and handlers; see docs/API_REFERENCE.md.
openapi: 3.0.3
info:
  title: satspathd HTTP API
  version: 0.1.0
  description: |
    HTTP API of **satspathd**, the SatsPath receiver-profile and authoritative-server daemon.

    SatsPath is a non-custodial discovery and verification layer: the daemon **never** moves funds, signs
    Bitcoin transactions, broadcasts payments or stores seeds/spending keys. `POST /v1/pay` returns a
    wallet-handoff payload only.

    **Authentication.** Requests other than `GET`, `HEAD` and `OPTIONS`, except a small public allow-list, require
    `Authorization: Bearer <token>`, where the token is the 64-hex content of `<home>/admin.macaroon`
    (or `SATSPATHD_AUTH_TOKEN`). `GET`, `HEAD` and `OPTIONS` are not authenticated.

    **Pipeline order.** Host allow-list (400) → body size (413) → per-IP rate limit (429) → auth (401) → route (404).

    **Errors.** Failures are `{"error": "..."}`. Some read endpoints return that body with **HTTP 200**
    (documented per operation as `oneOf [Success, Error]`).

    **Maturity.** BIP-353 and BOLT12 primitives are IMPLEMENTED; Ark routing is PREVIEW; Silent Payments,
    P2P and invites are EXPERIMENTAL; PQC fields are RESEARCH. Note that `/v1/quote`, `/v1/preview`,
    `/v1/pay` and `/v1/receive` still enforce strict on-chain BIP-21 handoff validation. No independent
    security audit has been completed.

    Illustrative example values (hashes, signatures) are synthetic and are not cryptographically valid.
    Full prose reference: `docs/API_REFERENCE.md`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://127.0.0.1:9737
  description: Local daemon (default bind)
- url: https://{host}
  description: TLS or reverse-proxy deployment
  variables:
    host:
      default: node.example.com
      description: Must match SATSPATH_AUTHORITY_DOMAIN or SATSPATH_AUTHORITY_URL.
tags:
- name: UI
  description: Embedded dashboard assets.
- name: Health & Diagnostics
  description: Liveness, readiness, metrics and rate-limit state.
- name: Node
  description: Local daemon identity and status.
- name: Profile
  description: Local profile management (mostly Bearer-protected).
- name: Resolution & Routing
  description: Resolve, quote, preview, pay (wallet handoff), send and receive.
- name: S2S v2
  description: Authoritative proof-carrying server API.
- name: Transparency
  description: Append-only log, checkpoints, proofs and Bitcoin anchors.
- name: Invites
  description: Invite and claim flow for unregistered recipients.
security: []
paths:
  /:
    get:
      tags:
      - UI
      summary: Dashboard (wallet UI)
      description: 'Single-page local dashboard. Served with a restrictive CSP and `X-Frame-Options: DENY`.'
      operationId: getDashboard
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /claim:
    get:
      tags:
      - UI
      summary: Dashboard (claim view)
      description: Same page as `/`; used by invite claim links.
      operationId: getClaimPage
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /dashboard-auth.mjs:
    get:
      tags:
      - UI
      summary: Dashboard auth helper script
      description: 'ES module that centralises authenticated dashboard requests. `Cache-Control: no-store`.'
      operationId: getDashboardAuthScript
      security: []
      responses:
        '200':
          description: JavaScript module.
          content:
            text/javascript:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health:
    get:
      tags:
      - Health & Diagnostics
      summary: Liveness probe
      description: Cheap liveness check. Always `healthy` when the process answers.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSimple'
              example:
                ok: true
                status: healthy
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/health:
    get:
      tags:
      - Health & Diagnostics
      summary: Deep health check
      description: Checks SQLite, fee API and the transparency log. Result is cached for 5 s. HTTP 200
        for `healthy`/`degraded`, **503 for `unhealthy`**.
      operationId: getDeepHealth
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepHealthResponse'
              example:
                ok: true
                status: healthy
                version: 0.1.0
                uptime_seconds: 3600
                timestamp: 1782810000
                dependencies:
                  sqlite:
                    status: healthy
                    latency_ms: 0.4
                    writable: true
                    log_id: satspath:localhost
                  fee_api:
                    status: healthy
                    latency_ms: 0.1
                    reachable: true
                    cached: true
                  transparency_log:
                    status: healthy
                    latency_ms: 1.2
                    checkpoint_count: 1
                    latest_checkpoint_age_secs: 30
                    is_stale: false
        '503':
          description: '`unhealthy` (SQLite or transparency log failing).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepHealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/health:
    get:
      tags:
      - Health & Diagnostics
      summary: S2S v2 readiness
      description: 'HTTP 200 when `healthy`, **503 when `degraded`** (note: stricter than `/v1/health`).'
      operationId: getV2Health
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2HealthResponse'
              example:
                version: 2.0.0
                status: healthy
                checkpoint_age_secs: 30
                witness_quorum_healthy: true
                replica_count: 1
        '503':
          description: '`degraded`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /metrics:
    get:
      tags:
      - Health & Diagnostics
      summary: Prometheus metrics
      description: 'Prometheus text exposition format. Scrapers inside the compose network may send `Host:
        satspathd`, which is exempt from the Host allow-list for this route only.'
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP satspathd_http_requests_total ...
        '500':
          description: Metrics could not be gathered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
