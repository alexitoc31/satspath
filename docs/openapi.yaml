      - total_blocked
      - total_payload_too_large
      - burst_capacity
      - refill_rate_per_sec
      - trust_proxy_headers
      - max_body_bytes
    StatusResponse:
      type: object
      properties:
        daemon:
          type: string
          enum:
          - satspathd
        version:
          type: string
        bind:
          type: string
        network:
          type: string
          description: '`devnet` (default), `testnet`, `signet`, `regtest` or `mainnet`.'
        home:
          type: string
          description: Daemon home directory (filesystem path).
        wallet_initialized:
          type: boolean
        alias:
          type: string
          nullable: true
        identity_fingerprint:
          type: string
          nullable: true
        methods:
          type: array
          items:
            type: string
            enum:
            - Onchain
            - Lightning
            - Ark
            - Bolt12
        safety:
          $ref: '#/components/schemas/SafetyStatus'
        rate_limit:
          $ref: '#/components/schemas/RateLimiterStats'
        is_tls:
          type: boolean
        behind_proxy:
          type: boolean
      required:
      - daemon
      - version
      - bind
      - network
      - home
      - wallet_initialized
      - alias
      - identity_fingerprint
      - methods
      - safety
      - rate_limit
      - is_tls
      - behind_proxy
    WalletState:
      type: object
      properties:
        alias:
          type: string
        identity_pubkey:
          type: string
        lightning_address:
          type: string
        onchain_address:
          type: string
        onchain_pubkey:
          type: string
        ark_server:
          type: string
        ark_pubkey:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        recovery_policy:
          $ref: '#/components/schemas/RecoveryPolicy'
      description: Public wallet state. Absent fields are omitted. Never contains secret keys.
    ProfileResponse:
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/WalletState'
        signed_profile:
          anyOf:
          - $ref: '#/components/schemas/SignedPaymentProfile'
          - type: object
            nullable: true
            enum:
            - null
        signature_valid:
          type: boolean
          nullable: true
      required:
      - wallet
      - signed_profile
      - signature_valid
    NodeResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusResponse'
        profile:
          $ref: '#/components/schemas/ProfileResponse'
      required:
      - status
      - profile
    ProfileUpdateRequest:
      type: object
      properties:
        alias:
          type: string
          description: Must equal the already-verified alias (see challenge/verify), else HTTP 400.
        lightning_address:
          type: string
        onchain_address:
          type: string
          description: Validated against the daemon network.
        onchain_pubkey:
          type: string
          description: Compressed pubkey hint; requires `onchain_address`.
        ark_server:
          type: string
          description: Must be sent together with `ark_pubkey`.
        ark_pubkey:
          type: string
        remove_methods:
          type: array
          items:
            type: string
            enum:
            - lightning
            - onchain
            - ark
        recovery_policy:
          $ref: '#/components/schemas/RecoveryPolicy'
      description: All fields optional. `POST /v1/profile/methods` requires at least one.
      example:
        lightning_address: alice@getalby.com
        onchain_address: tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx
    ChallengeResponse:
      type: object
      properties:
        challenge_id:
          type: string
        message:
          type: string
      required:
      - challenge_id
      - message
      description: 'Development-only mock email verifier (requires `--dev-mock-alias-verification` on non-mainnet): the token equals the email address itself. Not a real attestation.'
    VerifyRequest:
      type: object
      properties:
        alias:
          type: string
        token:
          type: string
      required:
      - alias
      - token
      example:
        alias: alice@example.com
        token: alice@example.com
    KeyRotationResponse:
      type: object
      properties:
        alias:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        previous_fingerprint:
          type: string
        new_fingerprint:
          type: string
        event_hash:
          type: string
        checkpoint_hash:
          type: string
      required:
      - alias
      - sequence
      - previous_fingerprint
      - new_fingerprint
      - event_hash
      - checkpoint_hash
    KeyRecoveryResponse:
      type: object
      properties:
        alias:
          type: string
        sequence:
          type: integer
          format: int64
          minimum: 0
        previous_fingerprint:
          type: string
        new_fingerprint:
          type: string
        event_hash:
          type: string
        checkpoint_hash:
          type: string
      required:
      - alias
      - sequence
      - previous_fingerprint
      - new_fingerprint
      - event_hash
      - checkpoint_hash
    ProfileRecoverRequest:
      type: object
      properties:
        alias:
          type: string
        proof:
          $ref: '#/components/schemas/KeyRecoveryProof'
        signed_profile:
          $ref: '#/components/schemas/SignedPaymentProfile'
        event_created_at:
          type: integer
          format: int64
          description: Required when `event_signature` is given; must be within +/-300 s.
        event_signature:
