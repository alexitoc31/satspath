          type: string
        identifier_hash:
          type: string
        display_hint:
          type: string
        amount_sats:
          type: integer
          format: int64
        claimed_at:
          type: integer
          format: int64
        claimed_profile_pubkey:
          type: string
        read:
          type: boolean
