          type: string
        alias:
          type: string
        amount_sats:
          type: integer
          format: int64
        profile_pubkey:
          type: string
        claimed_at:
          type: integer
          format: int64
        message:
          type: string
      required:
      - status
      - invite_id
      - alias
      - amount_sats
      - profile_pubkey
      - claimed_at
      - message
    ClaimNotification:
