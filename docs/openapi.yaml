      - sender_pubkey
    ClaimRequest:
      type: object
      properties:
        invite_id:
          type: string
        alias:
          type: string
        signed_profile:
          $ref: '#/components/schemas/SignedPaymentProfile'
        lightning_address:
          type: string
        onchain_address:
          type: string
        onchain_pubkey:
          type: string
        ark_server:
          type: string
        ark_pubkey:
          type: string
      required:
      - invite_id
      - alias
      description: Either supply a `signed_profile`, or plain receive methods (the daemon signs with its
        own identity).
      example:
        invite_id: 6f1c2d3e-8a4b-4c5d-9e6f-7a8b9c0d1e2f
        alias: alice@example.com
        lightning_address: alice@getalby.com
