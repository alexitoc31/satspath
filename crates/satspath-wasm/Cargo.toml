[package]
name = "satspath-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for SatsPath — minimal crypto, resolver, and router for browser/PWA"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
bitcoin = { workspace = true }
satspath-handoff = { path = "../satspath-handoff" }
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Request", "Response", "Headers", "Window", "Crypto", "SubtleCrypto",
    "RequestInit", "RequestMode", "Blob", "BlobPropertyBag",
    "TextEncoder", "TextDecoder", "Document", "FetchEvent"
] }
console_error_panic_hook = { version = "0.1", optional = true }

# Crypto - minimal deps that work on WASM
secp256k1 = { version = "0.29", default-features = false, features = ["global-context", "rand"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
canonical_json = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"

# getrandom for WASM
getrandom = { version = "0.2", features = ["js"] }

# HTTP client for resolver (using web-sys fetch directly)
# reqwest removed - using web-sys fetch directly

# URL parsing
url = { version = "2", default-features = false, features = ["serde"] }

# PQC
satspath-pqc = { path = "../satspath-pqc" }

# Bech32 for address validation
bech32 = "0.9"

# Hmac for BIP-352
hmac = "0.12"

# URL encoding for Ark URIs
urlencoding = "2"

# serde_wasm_bindgen for deserializing from JS values
serde-wasm-bindgen = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
wasm-bindgen-test = "0.3"
secp256k1 = { version = "0.29", default-features = false, features = ["global-context"] }
