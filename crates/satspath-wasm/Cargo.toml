[package]
name = "satspath-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for SatsPath — minimal crypto, resolver, and router for browser/PWA"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "bip353", "ark", "bolt12"]
bip353 = []
ark = []
bolt12 = []
pqc = ["dep:satspath-pqc"]
small_alloc = ["dep:wee_alloc"]

[dependencies]
bitcoin = { workspace = true }
satspath-handoff = { path = "../satspath-handoff" }
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Request", "Response", "Window", "RequestInit", "RequestMode"
] }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

# Crypto - minimal deps that work on WASM (lowmemory shrinks secp256k1 static tables from >1MB to ~16KB)
secp256k1 = { version = "0.29", default-features = false, features = ["global-context", "rand", "lowmemory"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"

# getrandom for WASM
getrandom = { version = "0.2", features = ["js"] }

# Standards-compliant URL and query parsing
url = { version = "2", default-features = false, features = ["serde"] }

# Optional Post-Quantum Cryptography (feature-gated to keep default WASM bundle < 500KB)
satspath-pqc = { path = "../satspath-pqc", optional = true }

# Bech32 for address validation
bech32 = "0.9"

# Hmac for BIP-32/identity key derivation
hmac = "0.12"

# serde_wasm_bindgen for deserializing from JS values
serde-wasm-bindgen = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
wasm-bindgen-test = "0.3"
secp256k1 = { version = "0.29", default-features = false, features = ["global-context"] }
